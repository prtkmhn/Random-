name: Trickle

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

packages:
  BeadEngine:
    path: Engine

targets:
  TrickleWatch:
    type: application
    platform: watchOS
    sources: [Watch]
    dependencies:
      - package: BeadEngine
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Trickle
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.example.trickle
        WKRunsIndependentlyOfCompanionApp: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.trickle.watchkitapp

  Trickle:
    type: application
    platform: iOS
    sources: [iOS]
    dependencies:
      - target: TrickleWatch
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Trickle
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.trickle

schemes:
  Trickle:
    build:
      targets:
        Trickle: all
        TrickleWatch: all
  TrickleWatch:
    build:
      targets:
        TrickleWatch: all
